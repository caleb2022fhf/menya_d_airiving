
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d18">
    <title>Admin Login | MENYA DRIVING AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #f5f7ff;
            background: #080d18;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border: 1px solid rgba(0, 212, 255, 0.25);
            border-radius: 18px;
            background: #111a2b;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .logo {
            width: 55px;
            height: 55px;
            display: grid;
            place-items: center;
            margin: 0 auto 18px;
            border-radius: 15px;
            color: #080d18;
            font-size: 25px;
            font-weight: 900;
            background: linear-gradient(135deg, #00d4ff, #7657ff);
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #9ba9bd;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 9px;
            outline: none;
            color: white;
            background: #080f1d;
            font-size: 15px;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: #00d4ff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            color: #06101b;
            background: linear-gradient(120deg, #00d4ff, #67a9ff);
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        #message {
            min-height: 22px;
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            color: #ff7777;
        }

        .back {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #00d4ff;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <main class="login-card">
        <div class="logo">M</div>

        <h1>Admin Login</h1>
        <p class="subtitle">MENYA DRIVING AI Administration</p>

        <form id="adminLoginForm">
            <label for="password">Admin Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                Sign In
            </button>

            <p id="message" role="alert"></p>
        </form>

        <a class="back" href="../index.html">← Back to Homepage</a>
    </main>

    <script>
        const form = document.getElementById("adminLoginForm");
        const message = document.getElementById("message");
        const button = document.getElementById("loginButton");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            message.textContent = "";
            button.disabled = true;
            button.textContent = "Signing in...";

            try {
                const response = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        password: document.getElementById("password").value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Login failed.");
                }

                window.location.href = "/frontend/admin/dashboard.html";

            } catch (error) {
                message.textContent = error.message;
            } finally {
                button.disabled = false;
                button.textContent = "Sign In";
            }
        });
    </script>

</body>
</html>
